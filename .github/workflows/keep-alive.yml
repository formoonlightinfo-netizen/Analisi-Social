name: Keep Moonlight Analyzer awake

# Il piano gratuito di Render "addormenta" il server dopo 15 minuti senza
# richieste, e ripartendo azzera tutto ciò che non è stato ancora salvato su
# GitHub (vedi src/persist.js). Un ping regolare qui evita che si addormenti
# del tutto, così non c'è mai una finestra abbastanza lunga da perdere dati.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping l'app
        run: curl -sf -u "${{ secrets.APP_AUTH_USER }}:${{ secrets.APP_AUTH_PASSWORD }}" "${{ secrets.APP_URL }}" -o /dev/null
