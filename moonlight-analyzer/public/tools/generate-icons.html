<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genera icone</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0a0f1c; color: #eaf1fb; padding: 24px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; }
  p { color: #93a8c9; font-size: 14px; line-height: 1.5; }
  .previews { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
  .previews canvas { border-radius: 12px; border: 1px solid #26375a; }
  button { background: linear-gradient(135deg, #4d94ff, #2e6fe0); color: #08111f; border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }
  button:disabled { opacity: 0.5; }
  #status { margin-top: 16px; font-size: 14px; white-space: pre-wrap; }
  #logoImg { display: none; }
</style>
</head>
<body>
  <h1>Genera icone dell'app</h1>
  <p>Prende il logo già presente in <code>public/logo.png</code>, lo mette su sfondo blu e salva le icone per la schermata Home del telefono. Basta un click.</p>

  <img id="logoImg" src="../logo.png" crossorigin="anonymous" />
  <div class="previews" id="previews"></div>

  <button id="genBtn">Genera e salva le icone</button>
  <div id="status"></div>

<script>
const SIZES = [32, 180, 192, 512];
const logoImg = document.getElementById('logoImg');
const previews = document.getElementById('previews');
const status = document.getElementById('status');
const genBtn = document.getElementById('genBtn');

function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const radius = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(radius, 0);
  ctx.arcTo(size, 0, size, size, radius);
  ctx.arcTo(size, size, 0, size, radius);
  ctx.arcTo(0, size, 0, 0, radius);
  ctx.arcTo(0, 0, size, 0, radius);
  ctx.closePath();
  ctx.clip();

  const gradient = ctx.createRadialGradient(size * 0.35, size * 0.3, 0, size * 0.5, size * 0.5, size * 0.75);
  gradient.addColorStop(0, '#2a5f9e');
  gradient.addColorStop(0.55, '#122a4d');
  gradient.addColorStop(1, '#080f1e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  const logoScale = 0.68;
  const iw = logoImg.naturalWidth;
  const ih = logoImg.naturalHeight;
  const maxDim = size * logoScale;
  let dw, dh;
  if (iw > ih) { dw = maxDim; dh = (ih / iw) * maxDim; }
  else { dh = maxDim; dw = (iw / ih) * maxDim; }
  const dx = (size - dw) / 2;
  const dy = (size - dh) / 2;
  ctx.drawImage(logoImg, dx, dy, dw, dh);

  return canvas;
}

function render() {
  previews.innerHTML = '';
  for (const size of SIZES) {
    const canvas = drawIcon(size);
    canvas.style.width = '64px';
    canvas.style.height = '64px';
    previews.appendChild(canvas);
  }
}

logoImg.onload = () => {
  render();
  genBtn.disabled = false;
  status.textContent = 'Logo caricato. Anteprima pronta sopra.';
};
logoImg.onerror = () => {
  status.textContent = '⚠ Non trovo public/logo.png. Assicurati di averlo messo lì prima di usare questa pagina.';
  genBtn.disabled = true;
};
genBtn.disabled = true;

genBtn.addEventListener('click', async () => {
  genBtn.disabled = true;
  status.textContent = 'Genero e salvo...';
  try {
    const sizes = {};
    for (const size of SIZES) {
      const canvas = drawIcon(size);
      sizes[size] = canvas.toDataURL('image/png');
    }
    const res = await fetch('/api/generate-icons', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sizes }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Errore ${res.status}`);
    status.textContent = '✔ Fatto! Le icone sono state salvate. Se avevi già aggiunto l\'app alla schermata Home, rimuovila e rifai "Aggiungi alla schermata Home" per vedere la nuova icona.';
  } catch (err) {
    status.textContent = '⚠ ' + err.message;
  } finally {
    genBtn.disabled = false;
  }
});
</script>
</body>
</html>
